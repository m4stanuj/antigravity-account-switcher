name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate extension syntax
        run: node --check extension.js
      - name: Test the read-only inventory
        run: npm test
      - name: Verify the retired PowerShell entry point
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/profile_manager.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

          $scriptPath = (Resolve-Path 'scripts/profile_manager.ps1').Path
          $isolatedRoot = Join-Path $env:RUNNER_TEMP ('legacy-profile-check-' + [guid]::NewGuid().ToString('N'))
          $env:APPDATA = Join-Path $isolatedRoot 'roaming'
          $env:LOCALAPPDATA = Join-Path $isolatedRoot 'local'
          $env:USERPROFILE = Join-Path $isolatedRoot 'user'
          $profilesRoot = Join-Path $isolatedRoot 'profiles'
          $sessionRoots = @(
            $profilesRoot
            (Join-Path $env:APPDATA 'Antigravity')
            (Join-Path $env:LOCALAPPDATA 'Antigravity')
            (Join-Path $env:USERPROFILE '.antigravity')
          )
          foreach ($action in @('save', 'switch', 'delete')) {
            $output = & pwsh -NoProfile -NonInteractive -File $scriptPath -Action $action -ProfilesRoot $profilesRoot -Slot 1 -ProfileName 'Retirement check'
            if ($LASTEXITCODE -ne 1) {
              throw "Expected the retired action '$action' to exit with status 1."
            }
            $result = $output | ConvertFrom-Json
            if ($result.success -ne $false -or $result.message -ne 'Legacy Antigravity session operations have been retired.') {
              throw "Expected a retirement response for '$action'."
            }
            foreach ($root in $sessionRoots) {
              if (Test-Path -LiteralPath $root) {
                throw "Retired action '$action' unexpectedly created a profile or session directory."
              }
            }
          }
          exit 0
